[build]
  command = "node scripts/prepare-iota.mjs && hugo --gc --minify -b $URL"
  publish = "public" 

[build.environment]
  HUGO_VERSION = "0.111.3"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "22"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "node scripts/prepare-iota.mjs && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "node scripts/prepare-iota.mjs && hugo --gc --minify -b $DEPLOY_PRIME_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/iota"
  to = "/iota/"
  status = 301

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
