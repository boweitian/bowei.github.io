<text x="845.0" y="284.0" font-size="12" fill="#6f6a60" text-anchor="start" font-weight="normal" font-style="normal">(present big with future)</text>
<text x="60.0" y="84.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">● Each state h sees the whole text before it, from its own position — a living mirror</text>
<text x="60.0" y="110.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">● h4 and h6 look at the same context from different places — the same city from different sides</text>
<text x="60.0" y="136.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">● Every position runs on the same weights — each follows one unchanging “law”</text>
