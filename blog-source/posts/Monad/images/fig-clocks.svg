<text x="490.0" y="300.0" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="normal" font-style="normal">Keep a skilled hand beside them</text>
<text x="490.0" y="322.0" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="normal" font-style="normal">to reset them the moment they drift.</text>
<text x="490.0" y="356.0" font-size="13" fill="#6f6a60" text-anchor="middle" font-weight="normal" font-style="italic">(God intervenes at every instant)</text>
