<text x="170.0" y="300.0" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="normal" font-style="normal">Hang both clocks on one beam</text>
<text x="170.0" y="322.0" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="normal" font-style="normal">so each passes its beat to the other.</text>
<text x="170.0" y="356.0" font-size="13" fill="#6f6a60" text-anchor="middle" font-weight="normal" font-style="italic">(soul and body act on each other)</text>
