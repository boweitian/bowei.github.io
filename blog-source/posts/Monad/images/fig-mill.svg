<text x="333.0" y="393.0" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" font-style="normal">Gears push gears, levers pull levers…</text>
<text x="333.0" y="412.0" font-size="13" fill="#c0504d" text-anchor="middle" font-weight="bold" font-style="normal">but where is the feeling?</text>
<rect x="575" y="110" width="360" height="290" rx="12" fill="#ffffff" stroke="#e2dccf"/>
<text x="597.0" y="145.0" font-size="16" fill="#2b2b2b" text-anchor="start" font-weight="bold" font-style="normal">The thought experiment of §17</text>
<text x="597.0" y="182.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">Imagine a machine that thinks and feels.</text>
<text x="597.0" y="206.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">Enlarge it, keeping its proportions,</text>
<text x="597.0" y="230.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">until it is as big as a mill, and walk in.</text>
<text x="597.0" y="254.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="597.0" y="278.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">You will find only parts pushing</text>
<text x="597.0" y="302.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">one another — never anything that</text>
<text x="597.0" y="326.0" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">explains a perception.</text>
<text x="597.0" y="372.0" font-size="14" fill="#3d6fb6" text-anchor="start" font-weight="normal" font-style="normal">→ Perception lives in what is simple.</text>
</svg>
