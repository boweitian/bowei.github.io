<text x="701.0" y="283.0" font-size="15" fill="#2b2b2b" text-anchor="start" font-weight="bold" font-style="normal">The law of the whole curve</text>
<text x="701.0" y="305.0" font-size="15" fill="#3d6fb6" text-anchor="start" font-weight="bold" font-style="normal">= the monad itself</text>
