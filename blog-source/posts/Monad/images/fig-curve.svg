<text x="701.0" y="213.0" font-size="15" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">Appetition: the pull onward</text>
<text x="701.0" y="235.0" font-size="12" fill="#6f6a60" text-anchor="start" font-weight="normal" font-style="normal">(like the tangent at that point)</text>
