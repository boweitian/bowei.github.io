<text x="701.0" y="143.0" font-size="15" fill="#2b2b2b" text-anchor="start" font-weight="normal" font-style="normal">Perception: the state now</text>
<text x="701.0" y="165.0" font-size="12" fill="#6f6a60" text-anchor="start" font-weight="normal" font-style="normal">(the whole world, as seen right now)</text>
